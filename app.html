/* Layout: one-screen field app — sticky brand bar, scrolling list view, fixed bottom tab bar, full-height sheets for detail/forms */
:root{
  --bg:#0B0E0F; --surface:#13181A; --surface2:#1B2225; --line:#263033;
  --fg:#F4F8F8; --muted:#BCC5CA; --accent:#00A8A8; --accent-ink:#001616; --accent-soft:rgba(0,168,168,.14);
  --good:#3DBE7A; --warn:#E0A43A; --bad:#EF6A62;
  --display:"Barlow Condensed","BarlowC Local","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Barlow Local",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --fs:18px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F6F6; --surface:#FFFFFF; --surface2:#E6EEEE; --line:#CFDADA;
  --fg:#0B0E0F; --muted:#3A4249; --accent:#006B6C; --accent-ink:#FFFFFF; --accent-soft:rgba(0,122,123,.10);
  --good:#1D7F4C; --warn:#9A6200; --bad:#B9332C; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#F2F6F6; --surface:#FFFFFF; --surface2:#E6EEEE; --line:#CFDADA;
  --fg:#0B0E0F; --muted:#3A4249; --accent:#006B6C; --accent-ink:#FFFFFF; --accent-soft:rgba(0,122,123,.10);
  --good:#1D7F4C; --warn:#9A6200; --bad:#B9332C; color-scheme:light }
:root.big{--fs:21px}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.mark{width:36px;height:36px;flex:none}
.wm{font-family:var(--display);line-height:.95;min-width:0}
.wm b{display:block;font-size:24px;letter-spacing:.03em;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm span{display:block;font-size:14px;letter-spacing:.14em;color:var(--accent);font-weight:700;text-transform:uppercase}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:18px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.eyebrow{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.num{font-variant-numeric:tabular-nums}
.hero{position:relative;border-radius:14px;overflow:hidden;background:#0B0E0F;min-height:190px;display:flex;align-items:flex-end;border:1px solid var(--line)}
.hero-art{position:absolute;inset:0;width:100%;height:100%}
.hero .copy{position:relative;padding:18px;color:#FFFFFF;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:4px}
.hero .copy .eyebrow{color:#A8F5EF;font-size:15px}
.hero h1{font-size:34px;color:#FFFFFF}
.hero .tag{font-size:17px;color:#F0F6F6;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:15px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;min-height:64px}
.item:first-child{border-top:0}
.item:hover{background:var(--surface2)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:.92em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.unit{font-family:var(--display);font-weight:700;font-size:20px;min-width:52px;height:52px;padding:0 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-new,.p-draft{color:var(--muted)} .p-contacted,.p-scheduled,.p-sent{color:var(--accent)}
.p-quoted,.p-qc{color:var(--warn)} .p-won,.p-done,.p-paid,.p-inprogress{color:var(--good)} .p-lost,.p-overdue{color:var(--bad)}
.p-inprogress{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface2);font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:focus-visible,.item:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon-btn{width:48px;height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;max-width:36ch;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:44px;padding:0 16px;font-size:16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);cursor:pointer;min-height:64px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;height:58px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 22px rgba(0,0,0,.35);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-head .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.sheet-head h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .body{padding-block:18px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:15px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{width:100%;min-height:50px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:var(--fs)}
textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{min-height:52px;border:0;border-left:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;text-transform:none;letter-spacing:0;cursor:pointer;padding:0 4px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.line-items{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:minmax(0,1fr) 64px 96px 40px;gap:6px;align-items:center}
.li input{min-height:48px;padding:8px;font-size:17px}
.li .x{width:40px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:22px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.total b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.check{display:flex;gap:12px;align-items:center;min-height:52px;padding:6px 4px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:26px;height:26px;min-height:0;accent-color:var(--accent);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;max-width:100%;background:var(--surface2)}
.upload{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:2px dashed var(--muted);border-radius:8px;color:var(--fg);font-weight:700;font-size:15px;cursor:pointer;text-align:center;padding:4px}
.upload input{display:none}
.banner{border:2px solid var(--warn);color:var(--fg);border-radius:var(--r);padding:12px 14px;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-direction:column;gap:10px;border:1px solid var(--bad);border-radius:var(--r);padding:14px}
.late{color:var(--bad);font-weight:700}

  if(cloud){try{await api("PATCH","/api/ops/"+opsCol(col)+"/"+id,patch);const x=S[col].find(r=>r.id===id);if(x)Object.assign(x,patch);liveRender()}catch(e){fail(e)}return}
  const x=S[col].find(r=>r.id===id);if(x)Object.assign(x,patch);render()}
async function del(col,id){
  if(db){try{await db.collection(col).doc(id).delete()}catch(e){fail(e)}return}
  if(cloud){try{await api("DELETE","/api/ops/"+opsCol(col)+"/"+id);S[col]=S[col].filter(r=>r.id!==id);liveRender()}catch(e){fail(e)}return}
  S[col]=S[col].filter(r=>r.id!==id);render()}
async function saveCfg(patch){Object.assign(S.cfg,patch);
  if(db){try{await db.doc("config/app").set({...S.cfg})}catch(e){fail(e)}}
  else if(cloud){try{await api("PUT","/api/ops/config",{...S.cfg})}catch(e){fail(e)}}
  render()}

   stat(openLeads.length,"Open leads")+stat(active.length,"Units in turn")+stat(usd(unpaid.reduce((a,i)=>a+(+i.total||0),0)),"Owed to you")+stat(usd(collected),"Collected this month")+
  '</div><section class="row between"><h2>Needs attention</h2><span class="muted num">'+att.length+'</span></section>'+
  (att.length?'<div class="list">'+att.map(a=>'<button class="item" data-open="'+a.k+'" data-id="'+a.id+'"><div class="unit">'+h(a.unit||"—")+'</div><div class="main"><div class="t">'+h(a.t)+'</div><div class="s">'+h(a.s)+'</div></div><div class="r">'+a.p+'</div></button>').join("")+'</div>'
   :empty(S.loaded?"You're all caught up.":"Loading your work…",S.loaded?"Late jobs, units ready for inspection, new leads and overdue invoices will show up here.":"",S.loaded&&!S.leads.length?'<button class="btn primary" data-act="newLead">Add your first lead</button>':""))+
  (active.length?'<section class="row between"><h2>In turn now</h2><button class="btn" data-tab="jobs">All jobs</button></section><div class="list">'+active.sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")).slice(0,5).map(jobRow).join("")+'</div>':"");

  const f=S.filter.money;let I=S.invoices.slice().sort(byNew);

function haversine(a,b){if(!a||!b||!isFinite(a.lat)||!isFinite(b.lat)||!isFinite(a.lng)||!isFinite(b.lng)||a.lat===null||b.lat===null)return null;const R=3958.8,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const mi=d=>d==null?"":(d<10?d.toFixed(1):Math.round(d))+" mi";
const initials=n=>(n||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const stars=r=>r&&r.ratingCount?'★ '+(+r.rating).toFixed(1)+' ('+r.ratingCount+')':'New pro';
const vName=v=>v?(v.businessName||v.name||"Pro"):"Pro";
const reqVendor=r=>r.vendor||r.assignedVendor||null;
const reqVendorId=r=>r.vendorId||r.assignedVendorId||(reqVendor(r)&&reqVendor(r).id)||null;
const reqLive=r=>{const v=reqVendor(r)||{};const lat=r.vendorLat??v.lat??(r.vendorLocation&&r.vendorLocation.lat),lng=r.vendorLng??v.lng??(r.vendorLocation&&r.vendorLocation.lng);return lat!=null&&lng!=null?{lat:+lat,lng:+lng}:null};

function reqStatusLabel(r){if(r.status==="open")return r.mode==="now"?"Finding a pro":"Getting quotes";return RST[r.status]||r.status}
function sheetHasFocus(){const a=document.activeElement;return a&&a.closest&&a.closest(".sheet")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}

/* location */
function locate(force){return new Promise(res=>{
  if(!navigator.geolocation){res(null);return}
  if(S.myLoc&&!force&&Date.now()-(S.myLoc.at||0)<60000){res(S.myLoc);return}
  navigator.geolocation.getCurrentPosition(p=>{S.myLoc={lat:p.coords.latitude,lng:p.coords.longitude,at:Date.now()};S.locDenied=false;res(S.myLoc)},
    e=>{if(e&&e.code===1)S.locDenied=true;res(S.myLoc||null)},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})})}

/* map */
let leafletP=null;
function loadLeaflet(){if(window.L)return Promise.resolve(window.L);if(leafletP)return leafletP;
  leafletP=loadScript(["leaflet.js","https://cdn.jsdelivr.net/gh/transcenlutions25/seamless-download@main/leaflet.js"]).then(()=>{if(!window.L)leafletP=null;return window.L||null});return leafletP}
const darkMode=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":!(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)};
function tiles(L){return L.tileLayer(darkMode()?"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png":"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd",attribution:"© OpenStreetMap © CARTO"})}
const meIcon=L=>L.divIcon({className:"",html:'<div class="me-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]});
const pinIcon=(L,txt,cls)=>L.divIcon({className:"",html:'<div class="pin '+(cls||"")+'"><span>'+h(txt)+'</span></div>',iconSize:[44,52],iconAnchor:[22,50]});
async function mountMap(){
  const L=await loadLeaflet();const el=document.getElementById("mapbox");if(!el)return;
  if(!L){el.innerHTML='<div class="empty" style="height:100%;justify-content:center"><p>The map needs an internet connection.</p></div>';return}
  if(S.lmap&&S.lmap.getContainer()===el){updateMap();return}
  if(S.lmap){try{S.lmap.remove()}catch(_){}}
  const m=L.map(el,{zoomControl:false,attributionControl:true});S.lmap=m;tiles(L).addTo(m);S.mlayer=L.layerGroup().addTo(m);
  if(S.mapView)m.setView(S.mapView.c,S.mapView.z);else if(S.myLoc)m.setView([S.myLoc.lat,S.myLoc.lng],12);else m.setView([39.8,-98.6],4);
  m.on("moveend",()=>{S.mapView={c:m.getCenter(),z:m.getZoom()}});
  updateMap();
}
function shownPros(){const f=S.tradeFilter||"All";return (S.nearby||[]).filter(v=>f==="All"||(v.trades||[]).includes(f))}
function updateMap(){
  const L=window.L,m=S.lmap;if(!L||!m||!document.getElementById("mapbox"))return;S.mlayer.clearLayers();
  if(S.myLoc)L.marker([S.myLoc.lat,S.myLoc.lng],{icon:meIcon(L),interactive:false}).addTo(S.mlayer);
  shownPros().forEach(v=>{if(v.lat==null)return;const mk=L.marker([v.lat,v.lng],{icon:pinIcon(L,initials(vName(v)))}).addTo(S.mlayer);mk.on("click",()=>open("pro",v.id))});
  if(!S.mapView&&S.myLoc){m.setView([S.myLoc.lat,S.myLoc.lng],12)}
  const nl=document.getElementById("nearlist");if(nl)nl.innerHTML=nearList();
}
async function mountTrack(){
  const el=document.getElementById("trackbox");if(!el)return;const L=await loadLeaflet();if(!L)return;
  const r=S.reqs.find(x=>x.id===S.sheet.id);if(!r)return;const live=reqLive(r);const dest=r.lat!=null?{lat:+r.lat,lng:+r.lng}:null;
  if(!S.tmap||S.tmap.getContainer()!==el){if(S.tmap){try{S.tmap.remove()}catch(_){}}S.tmap=L.map(el,{zoomControl:false});tiles(L).addTo(S.tmap);S.tlayer=L.layerGroup().addTo(S.tmap)}
  S.tlayer.clearLayers();const pts=[];
  if(dest){L.marker([dest.lat,dest.lng],{icon:pinIcon(L,"Job","dest")}).addTo(S.tlayer);pts.push([dest.lat,dest.lng])}
  if(live){L.marker([live.lat,live.lng],{icon:pinIcon(L,initials(vName(reqVendor(r))))}).addTo(S.tlayer);pts.push([live.lat,live.lng])}
  if(pts.length>1)S.tmap.fitBounds(pts,{padding:[50,50],maxZoom:15});else if(pts.length)S.tmap.setView(pts[0],14);
}

function shReq(){const r=S.reqs.find(x=>x.id===S.sheet.id);if(!r)return sheetHead("Request")+'<div class="wrap body">'+empty("Request not found","","")+'</div>';
  const cust=isRole("customer"),ven=isRole("vendor"),own=isRole("owner"),mineV=ven&&reqVendorId(r)===S.user.id,v=reqVendor(r);
  const live=["on_the_way","arrived"].includes(r.status);
  let out=sheetHead(r.title||r.trade)+'<div class="wrap body"><div class="row between">'+pill(RCLS[r.status]||"new",reqStatusLabel(r))+'<span class="muted">'+h(r.trade)+' · '+(r.mode==="now"?"Book now":"Quotes")+'</span></div>';
  if(live&&(cust||own))out+='<div class="mapwrap" style="height:260px"><div id="trackbox"></div></div><p class="muted" style="margin:0">'+(r.status==="arrived"?"Your pro has arrived.":"Your pro is on the way. The map updates every few seconds.")+'</p>';
  out+='<div class="panel">'+(r.description?'<div style="white-space:pre-wrap">'+h(r.description)+'</div>':'')+'<div class="muted">'+h([r.address,r.preferredTime].filter(Boolean).join(" · "))+'</div>'+((r.photos||[]).length?'<div class="photos">'+r.photos.map(u=>'<img src="'+h(u)+'" alt="Job photo" loading="lazy">').join("")+'</div>':'')+(ven&&r.lat!=null?'<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination='+(+r.lat)+','+(+r.lng)+'" target="_blank" rel="noopener">Directions</a>':'')+'</div>';
  if(v&&r.status!=="open")out+='<div class="panel"><div class="eyebrow">'+(ven?"Customer":"Your pro")+'</div>'+(ven?'<b>'+h(r.customerName||r.customerFirstName||"Customer")+'</b>':'<div class="row"><div class="unit">'+h(initials(vName(v)))+'</div><div><b>'+h(vName(v))+'</b><div class="muted">'+h(stars(v))+'</div></div></div>')+'</div>';
  if((cust||own)&&r.status==="open"){
    if(r.mode==="now")out+='<div class="empty"><h3>Finding your pro…</h3><p>Available pros nearby can see your request now. You\'ll get a notice when one accepts.</p></div>';
    else{const Q=r.quotes||[];out+='<h2>Quotes</h2>'+(Q.length?'<div class="list">'+Q.map(q=>{const qv=qVendor(q);return '<div class="item" style="cursor:default;flex-wrap:wrap"><div class="unit">'+h(initials(vName(qv)))+'</div><div class="main"><div class="t">'+h(vName(qv))+'</div><div class="s">'+h([stars(qv),q.eta].filter(Boolean).join(" · "))+'</div>'+(q.message?'<div style="white-space:normal;margin-top:4px">'+h(q.message)+'</div>':'')+'</div><div class="r"><b class="num" style="font-size:1.2em">'+usd(q.price)+'</b>'+(cust?'<button class="btn primary" style="min-height:44px" data-act="mkAccept" data-q="'+h(q.id)+'">Accept</button>':'')+'</div></div>'}).join("")+'</div>':'<div class="empty"><p>No quotes yet. Pros nearby have been notified.</p></div>')}}
  if(ven&&r.status==="open"&&S.user.approved!==false){
    if(r.mode==="now")out+='<button class="btn primary block" data-act="mkClaim">Accept this job</button>';
    else{const mq=(r.quotes||[]).find(q=>(q.vendorId||(q.vendor&&q.vendor.id))===S.user.id);
      out+='<section class="panel"><h3>'+(mq?"Update your quote":"Send a quote")+'</h3><div id="est-box" class="est" hidden></div><div class="muted" id="q-keep">'+(mq?'You keep '+money2(mq.price*(100-myFeePct())/100)+' after the '+myFeePct()+'% fee.':'You keep '+(100-myFeePct())+'% after the platform fee. Tips are 100% yours.')+'</div><div class="grid2">'+fld("q-price","Price ($)",mq?mq.price:"","number")+fld("q-eta","When you can come",mq?mq.eta:"","text","e.g. Today 3pm")+'</div><div class="field"><label for="q-msg">Message</label><textarea id="q-msg" placeholder="What\'s included, materials, anything they should know">'+h(mq?mq.message:"")+'</textarea></div><button class="btn primary" data-act="mkQuote">'+(mq?"Update quote":"Send quote")+'</button></section>'}}
  if(mineV){const nx={booked:["on_the_way","I'm on the way"],on_the_way:["arrived","I've arrived"],arrived:["in_progress","Start work"],in_progress:["done","Mark job done"]}[r.status];
    if(nx&&nx[0]==="done"){const acc=(r.quotes||[]).find(q=>q.id===r.acceptedQuoteId)||(r.quotes||[]).find(q=>(q.vendorId||(q.vendor&&q.vendor.id))===S.user.id);
      out+='<section class="panel"><h3>Finish the job</h3><div id="est-box" class="est" hidden></div>'+fld("d-price","Final price ($)",acc?acc.price:"","number")+'<div class="muted" id="d-keep">'+(acc?'You keep '+money2(acc.price*(100-myFeePct())/100)+' after the '+myFeePct()+'% fee.':'Enter the price you charged.')+'</div><button class="btn primary" data-act="mkDone">Mark job done</button></section>'}
    else if(nx)out+='<button class="btn primary block" data-act="mkStatus" data-v="'+nx[0]+'">'+nx[1]+'</button>';}
  if(r.status==="done")out+=pricingHTML(r);
  if(cust&&r.status==="done"&&r.pricing&&!(+r.pricing.tip))out+='<section class="panel"><h3>Add a tip</h3><p class="muted" style="margin:0">100% goes to your pro.</p><div class="chips">'+[5,10,20].map(n=>'<button class="chip" data-act="mkTip" data-v="'+n+'">'+money2(n).replace(".00","")+'</button>').join("")+'</div></section>';
  if(cust&&r.status==="done"&&v)out+='<div class="grid2"><button class="btn" data-act="favToggle" data-id="'+h(v.id)+'">'+((S.favorites||[]).some(f=>f.id===v.id)?"♥ Favorite":"♡ Favorite")+'</button><button class="btn primary" data-act="mkNew" data-mode="now" data-pref="'+h(v.id)+'" data-trade="'+h(r.trade)+'">Book again</button></div>';
  if(cust&&r.status==="done"&&!r.review&&!r.reviewed){const st=S.sheet.stars||0;out+='<section class="panel"><h3>How did it go?</h3><div class="row" role="group" aria-label="Rating">'+[1,2,3,4,5].map(n=>'<button class="chip" style="font-size:22px;min-width:52px" data-act="mkStar" data-v="'+n+'" aria-pressed="'+(n<=st)+'" aria-label="'+n+' stars">★</button>').join("")+'</div><div class="field"><label for="rv-text">Review (optional)</label><textarea id="rv-text"></textarea></div><button class="btn primary" data-act="mkReview">Send review</button></section>'}
  if((cust||own)&&["open","booked"].includes(r.status))out+='<button class="btn danger" data-act="mkCancel">Cancel request</button>';
  return out+'</div>';
}

async function loadGrowth(){
  const tasks=[api("GET","/api/platform").then(r=>{S.platform=r&&r.settings?Object.assign({},r.settings,{announcements:r.announcements||r.settings.announcements||[]}):r}).catch(()=>{})];
  if(isRole("customer")||isRole("vendor"))tasks.push(api("GET","/api/me/wallet").then(r=>S.wallet=r).catch(()=>{}));
  if(isRole("customer")){tasks.push(api("GET","/api/me/favorites").then(r=>S.favorites=Array.isArray(r)?r:(r&&r.favorites)||[]).catch(()=>{}));
    if(S.myLoc)tasks.push(api("GET","/api/offers?lat="+S.myLoc.lat+"&lng="+S.myLoc.lng).then(r=>S.offers=Array.isArray(r)?r:(r&&r.offers)||[]).catch(()=>{}))}
  if(isRole("vendor")){tasks.push(api("GET","/api/me/earnings").then(r=>S.earnings=r).catch(()=>{}));tasks.push(api("GET","/api/me/offers").then(r=>S.myOffers=Array.isArray(r)?r:(r&&r.offers)||[]).catch(()=>{}))}
  if(isRole("owner")){tasks.push(api("GET","/api/admin/insights").then(r=>S.insights=r).catch(()=>{}));tasks.push(api("GET","/api/admin/promos").then(r=>S.promos=Array.isArray(r)?r:(r&&r.promos)||[]).catch(()=>{}));tasks.push(api("GET","/api/admin/attention").then(r=>S.attention=Array.isArray(r)?r:(r&&r.requests)||[]).catch(()=>{}))}
  await Promise.all(tasks);
}

async function aiCall(body){await sbInit();const {data,error}=await sb.functions.invoke("owner-ai",{body});
  if(error){let msg="";try{const j=await error.context.json();msg=j.error||j.reply||""}catch(_){}
    if(/Failed to fetch|NetworkError/i.test(error.message||""))throw {code:"offline"};throw {code:"http",message:msg||"The assistant isn't available right now."}}
  return data||{}}

  S.ai.msgs.push({role:"user",content:text});S.ai.pending=null;S.ai.busy=true;renderSheet();aiScroll();
  try{const d=await aiCall({messages:S.ai.msgs});S.ai.msgs.push({role:"assistant",content:d.reply||d.error||"…"});S.ai.pending=d.pending||null}
  catch(e){S.ai.msgs.push({role:"assistant",content:e.code==="offline"?"No internet right now. Try again when you're online.":e.message})}

  catch(e){S.ai.msgs.push({role:"assistant",content:e.message||"That didn't go through."})}
  S.ai.busy=false;renderSheet();aiScroll()}

    case "gRetry":cloudBoot();break;

    case "favToggle":{const id=t.dataset.id,isF=(S.favorites||[]).some(f=>f.id===id);try{await api(isF?"DELETE":"POST","/api/me/favorites/"+id);if(isF)S.favorites=S.favorites.filter(f=>f.id!==id);else{const v=(S.nearby||[]).find(x=>x.id===id)||reqVendor(S.reqs.find(r=>reqVendorId(r)===id)||{})||{id};S.favorites=(S.favorites||[]).concat([v])}toast(isF?"Removed from favorites":"Added to favorites");renderSheet();liveRender()}catch(e){fail(e)}break}

    case "pfSave":{const n=id=>+document.getElementById(id).value;const body={feePercent:n("pf-fee"),topProFeePercent:n("pf-top"),firstJobDiscountPercent:n("pf-first"),firstJobDiscountMax:n("pf-firstmax"),loyaltyPercent:n("pf-loyal"),referralCreditCustomer:n("pf-ref")};

    case "promoNew":{const code=document.getElementById("pr-code").value.trim().toUpperCase(),pct=+document.getElementById("pr-pct").value;if(!code||!pct){toast("Add a code and percent off");break}try{await api("POST","/api/admin/promos",{code,percentOff:pct,firstJobOnly:document.getElementById("pr-first").checked});toast("Promo "+code+" created");await loadGrowth();render()}catch(e){fail(e)}break}

    case "annNew":{const title=document.getElementById("an-title").value.trim();if(!title){toast("Add a title");break}try{await api("POST","/api/admin/announcements",{audience:document.getElementById("an-aud").value,title,body:document.getElementById("an-body").value});toast("Announcement posted");await loadGrowth();render()}catch(e){fail(e)}break}
    case "attResolve":{const amt=+document.getElementById("att-"+t.dataset.id).value||0;try{await api("POST","/api/admin/requests/"+t.dataset.id+"/resolve",{creditAmount:amt,note:"Make it right"});toast(amt?"Customer credited "+money2(amt):"Marked resolved");await loadGrowth();render()}catch(e){fail(e)}break}

    case "mkApprove":try{await api("PATCH","/api/admin/vendors/"+t.dataset.id,{approved:t.dataset.v==="1"});toast(t.dataset.v==="1"?"Pro approved":"Pro suspended");await refresh()}catch(e){fail(e)}break;
    case "aTrade":{const tr=new Set(S.user.trades||[]),v=t.dataset.v;tr.has(v)?tr.delete(v):tr.add(v);S.user.trades=[...tr];t.setAttribute("aria-pressed",tr.has(v));break}

      try{const r=await api("PATCH","/api/me",body);S.user=Object.assign(S.user,body,r&&r.id?r:r&&r.user?r.user:{});ls.set("ss-user",JSON.stringify(S.user));toast("Saved")}catch(e){fail(e)}break}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="ai-text"){e.preventDefault();aiSend(e.target.value);return}if(e.key==="Enter"&&S.gate&&e.target.tagName==="INPUT"){const b=document.querySelector("#view .btn.primary");if(b){e.preventDefault();b.click()}}});
document.addEventListener("input",e=>{
  const t=e.target;
  if((t.id==="q-price"||t.id==="d-price")&&S.sheet){const r=S.reqs.find(x=>x.id===S.sheet.id);if(r)loadEst(r.trade,r.lat!=null?{lat:r.lat,lng:r.lng}:null,"est-box",t.id)}
  if(t.id==="q-price"||t.id==="d-price"){const k=document.getElementById(t.id==="q-price"?"q-keep":"d-keep");const v=+t.value;if(k)k.textContent=v?"You keep "+money2(v*(100-myFeePct())/100)+" after the "+myFeePct()+"% fee. Tips are 100% yours.":"Enter your price.";}
  if(t.dataset.li!=null&&S.sheet){const it=draftItems()[+t.dataset.li];if(it){it[t.dataset.k]=t.value;const tot=document.getElementById("tot");if(tot)tot.textContent=usd(sum(draftItems()))}}
  if(t.dataset.pb!=null&&S.sheet){S.sheet.pb[+t.dataset.pb][t.dataset.k]=t.value}
});
document.addEventListener("change",async e=>{
  const t=e.target,sh=S.sheet;
  if(t.dataset.chk!=null&&sh){const j=get("jobs",sh.id);const c=(j.checklist||[]).map(x=>({...x}));c[+t.dataset.chk].done=t.checked;
    const p={checklist:c};if(j.status==="scheduled"&&t.checked){p.status="inprogress";p.startedAt=j.startedAt||now()}
    if(c.every(x=>x.done)&&j.status!=="done"&&j.status!=="qc"){p.status="qc";toast("Checklist complete. Ready for QC.")}
    await upd("jobs",sh.id,p);renderSheet();return}
  if(sh&&sh.kind==="job"&&sh.id&&(t.id==="j-vendor"||t.id==="j-due")){await upd("jobs",sh.id,t.id==="j-vendor"?{vendorId:t.value}:{due:t.value});toast("Saved");return}
  if(t.id==="r-trade"&&S.sheet&&S.sheet.kind==="reqnew"){rqGrab();loadEst(S.sheet.draft.trade,S.myLoc,"est-box");return}
  if(t.id==="m-cat"){S.tradeFilter=t.value;updateMap();const dl=document.getElementById("nearlist");if(dl)dl.innerHTML=nearList();return}
  if(t.id==="s-chime"){await saveCfg({chime:t.checked});return}
  if(t.id==="s-mute"){ls.set("ss-mute",t.checked?"1":"0");return}
  if(t.id==="s-big"){ls.set("ss-big",t.checked?"1":"0");document.documentElement.classList.toggle("big",t.checked);return}
  if(t.dataset.rphoto!=null&&t.files.length&&sh){rqGrab();toast("Uploading…");for(const f of t.files){try{const r=await S.assets.upload(await shrink(f));sh.draft.photos.push(r.url)}catch(_){toast("A photo didn't upload")}}renderSheet();return}
  if(t.dataset.photo&&t.files.length){const stage=t.dataset.photo;toast("Uploading "+t.files.length+" photo"+(t.files.length>1?"s":"")+"…");
    const added=[];for(const f of t.files){try{const blob=await shrink(f);const r=await S.assets.upload(blob);added.push({id:r.id,url:r.url,stage,at:now(),local:!!r.local})}catch(err){toast("A photo didn't upload. Try a smaller picture.")}}
    if(added.length){const j=get("jobs",sh.id);await upd("jobs",sh.id,{photos:(j.photos||[]).concat(added)});toast(added.length+" photo"+(added.length>1?"s":"")+" saved")}return}
  if(t.dataset.logo!=null&&t.files[0]){try{const b=await shrink(t.files[0],384);let url;if(S.assets){url=(await S.assets.upload(b)).url}else{url=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}await saveCfg({logoUrl:url});toast("Logo updated")}catch(_){toast("Logo didn't upload. Try a PNG or JPG.")}}
});
function shrink(file,max){max=max||1600;return new Promise(res=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));if(s===1&&file.size<1.5e6){URL.revokeObjectURL(u);res(file);return}
    const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),"image/jpeg",.85)};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}

document.addEventListener("pointerdown",()=>{window.__ssTouched=true},{once:true,capture:true});
if(ls.get("ss-big")==="1")document.documentElement.classList.add("big");
const hs=(location.hash||"").slice(1);if(TABS.some(x=>x[0]===hs))S.tab=hs;
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(curTabs().some(x=>x[0]===k)&&k!==S.tab){S.tab=k;S.sheet=null;render()}});
render();

function signedIn(r){const tok=r&&(r.token||r.accessToken);const u=r&&(r.user||r.account);if(!tok||!u){toast("Sign-in response was incomplete. Try again.");return}
  S.token=tok;S.user=u;ls.set("ss-token",tok);ls.set("ss-user",JSON.stringify(u));S.gate=null;S.gd={trades:new Set()};
  S.tab=u.role==="customer"?"map":u.role==="vendor"?"home":"today";render();locate().then(()=>{if(u.role!=="owner")loadNearby().then(liveRender)});refresh();heartbeat()}
async function cloudBoot(){
  cloud=true;S.assets=cloudAssets;try{S.user=JSON.parse(ls.get("ss-user")||"null")}catch(_){S.user=null}
  let sess=null;try{await sbInit();sess=(await sb.auth.getSession()).data.session}catch(_){if(S.user&&ls.get("ss-token"))sess={access_token:ls.get("ss-token")}}
  S.token=sess?sess.access_token:"";if(!S.token){S.user=null}
  if(S.token&&!S.user){try{S.user=await rpc("me");ls.set("ss-user",JSON.stringify(S.user))}catch(_){}}
  if(S.token&&S.user){S.gate=null;S.tab=S.user.role==="customer"?"map":S.user.role==="vendor"?"home":(curTabs().some(x=>x[0]===S.tab)?S.tab:"today");cacheLoad();render();locate().then(()=>{if(!isRole("owner"))loadNearby().then(liveRender)});refresh();heartbeat();if(isRole("vendor")&&S.user.available)sendBeat();return}
  S.gate="loading";render();
  let h0;try{h0=await api("GET","/api/health")}catch(e){S.gate="offline";render();return}
  S.ownerExists=!!(h0&&(h0.ownerExists??h0.setup));S.gate="welcome";render();
}
setInterval(()=>{if(cloud&&!S.gate&&document.visibilityState==="visible")refresh()},S_POLL());
function S_POLL(){return 12000}
document.addEventListener("visibilitychange",()=>{if(cloud&&!S.gate&&document.visibilityState==="visible")refresh()});
(async()=>{
  const inArtifact=!window.Capacitor&&!!(window.claude&&window.claude.use);
  if(!inArtifact){cloudBoot();return}
  const timer=setTimeout(()=>{if(!S.live&&!S.loaded){S.mode="practice";S.loaded=true;render()}},10000);
  const [d,a,u]=await Promise.all([claude.use("db"),claude.use("assets"),claude.use("user")]);
  if(u){try{const ce=await u.can("data.write");S.canEdit=ce!==false}catch(_){}}
  S.assets=a||null;
  if(!d){clearTimeout(timer);S.mode="practice";S.loaded=true;render();return}
  db=d;S.live=true;let pending=5;const done=()=>{if(--pending===0){clearTimeout(timer);S.loaded=true}liveRender()};
  const firstOf=()=>{let first=true;return()=>{if(first){first=false;done()}else liveRender()}};
  ["leads","jobs","invoices","vendors"].forEach(col=>{const f=firstOf();
    db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(x=>({id:x.id,...x.data()}));f()},()=>{f()})});
  const fc=firstOf();
  db.doc("config/app").onSnapshot(snap=>{if(snap.exists){const c=snap.data();S.cfg=Object.assign({},S.cfg,c);fixPB()}fc()},()=>fc());
})();
})();
